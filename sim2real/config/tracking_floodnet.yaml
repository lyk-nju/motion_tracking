# FloodNet offline replay configuration for motion_tracking runtime.
#
# Two modes:
#
# A) Single clip (backward compat):
#    floodnet_clip_path: "assets/data/example_reference_chunk.npz"
#
# B) Session-scoped multi-chunk (recommended for continuous replay):
#    floodnet_session_dir: "path/to/floodnet_clips/<session_id>"
#    floodnet_autoplay: true
#    floodnet_refill_watermark: 30
#
# Usage:
#   1. Run Text2Humanoid with backend: floodnet_file to populate the session dir.
#   2. Set floodnet_session_dir below.
#   3. Run: uv run src/deploy.py --sim2sim --tracking-config config/tracking_floodnet.yaml

motion_source: "floodnet"
floodnet_clip_path: "/home/lai/大学/text2motion/Text2Humanoid/artifacts/retargeted/reference_e549d75ba56d.npz"
floodnet_loop: true

